name: Build JARVIS 65 Android Compatibility APK

on:
  push:
    branches: ["jarvis65-mobile-apk"]
  workflow_dispatch:

jobs:
  build-compat:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and verify source ZIP
        shell: bash
        run: |
          cat source.part00 source.part01 source.part02a source.part02b source.part02c source.part02d source.part03 > source.b64
          test "$(wc -c < source.b64)" -eq 51348
          base64 -d source.b64 > source.zip
          echo "f4c01f9ebecc921130a6b99e338dbd915bbb884410ef87d83e0bda2f8135a3e4  source.zip" | sha256sum -c -
          unzip -q source.zip

      - name: Prepare compatibility build
        shell: bash
        run: |
          python3 - <<'PY'
          p='Jarvis65Mobile/app/build.gradle.kts'
          s=open(p,encoding='utf-8').read()
          s=s.replace('applicationId = "com.cim65.jarvis"','applicationId = "com.cim65.jarvis.compat"')
          s=s.replace('minSdk = 26','minSdk = 23')
          s=s.replace('targetSdk = 35','targetSdk = 34')
          s=s.replace('versionCode = 3','versionCode = 4')
          s=s.replace('versionName = "0.3.0-native-assistant"','versionName = "0.3.1-compat"')
          open(p,'w',encoding='utf-8').write(s)
          PY
          sed -i '/FOREGROUND_SERVICE_MICROPHONE/d' Jarvis65Mobile/app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "platforms;android-34" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build compatibility APK
        working-directory: Jarvis65Mobile
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -f Jarvis65Mobile/app/build/outputs/apk/debug/app-debug.apk
          sha256sum Jarvis65Mobile/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis65-Mobile-v0.3.1-compat-debug-apk
          path: Jarvis65Mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
