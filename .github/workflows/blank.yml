name: Verificación básica

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verificar archivos del sitio
        run: |
          test -f README.md
          test -f autorizar-gasto.html
          echo "Repositorio ObraControl OK"
