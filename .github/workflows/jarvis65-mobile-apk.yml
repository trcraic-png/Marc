name: Build JARVIS 65 Android APK

on:
  push:
    branches: ["jarvis65-mobile-apk"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Unpack JARVIS Mobile source
        run: unzip -q jarvis65-mobile-v0.3.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: Jarvis65Mobile
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis65-Mobile-v0.3-debug-apk
          path: Jarvis65Mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
