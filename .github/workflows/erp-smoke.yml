name: ObraControl ERP Automated QA

on:
  push:
    branches: ["main"]
    paths:
      - "site/erp/**"
      - ".github/workflows/erp-smoke.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  static-live-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static integrity checks
        shell: bash
        run: |
          set -euo pipefail
          test -s site/erp/index.html
          test -s site/erp/residente.html
          test -s site/erp/inversionista.html
          test -s site/erp/cliente.html

          grep -q "ObraControl ERP v11.9.3" site/erp/index.html
          grep -q "./residente.html" site/erp/index.html
          grep -q "./inversionista.html" site/erp/index.html
          grep -q "./cliente.html" site/erp/index.html

          grep -q "sessionStorage" site/erp/residente.html
          ! grep -q "localStorage" site/erp/residente.html
          grep -q "x-resident-key" site/erp/residente.html
          grep -q "history.replaceState" site/erp/residente.html

          grep -q "sessionStorage" site/erp/inversionista.html
          grep -q "x-investor-key" site/erp/inversionista.html
          grep -q "history.replaceState" site/erp/inversionista.html

          grep -q "sessionStorage" site/erp/cliente.html
          grep -q "x-client-key" site/erp/cliente.html
          grep -q "history.replaceState" site/erp/cliente.html

          ! grep -Rqi "SUPABASE_SERVICE_ROLE_KEY" site/erp
          ! grep -Rqi "service_role" site/erp

      - name: Wait for published site
        id: livecheck
        shell: bash
        run: |
          set -euo pipefail
          base="https://trcraic-png.github.io/Marc/erp"
          check_all() {
            curl -fsSL "$base/" | grep -q "ObraControl ERP v11.9.3" &&
            curl -fsSL "$base/residente.html" | grep -q "ObraControl | Residente" &&
            curl -fsSL "$base/inversionista.html" | grep -q "ObraControl Inversionista" &&
            curl -fsSL "$base/cliente.html" | grep -q "Portal de cliente"
          }
          for i in {1..12}; do
            if check_all; then
              echo "All four ERP portals are online."
              exit 0
            fi
            sleep 10
          done

          echo "Initial smoke failed. Triggering a Pages redeploy once."
          gh workflow run pages.yml --ref main || true
          sleep 45

          for i in {1..6}; do
            if check_all; then
              echo "Recovered after redeploy."
              exit 0
            fi
            sleep 10
          done

          echo "ERP live smoke test failed after automatic redeploy."
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Supabase public API reachability
        shell: bash
        run: |
          set -euo pipefail
          base="https://syhfjvhfpuvbawgexdun.supabase.co/functions/v1"
          for fn in obra-admin-api obra-erp-api obra-resident-field-api obra-client-portal-api obra-investor-portal-api obra-resident-admin-api; do
            code=$(curl -sS -o /tmp/resp -w "%{http_code}" -X OPTIONS "$base/$fn")
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "$fn OPTIONS failed with HTTP $code"
              cat /tmp/resp
              exit 1
            fi
          done
          echo "Supabase Edge APIs reachable."

      - name: Browser runtime checks
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > /tmp/erp-browser-check.mjs <<'NODE'
          import { chromium } from 'playwright';

          const checks = [
            ['https://trcraic-png.github.io/Marc/erp/', 'ObraControl ERP v11.9.3'],
            ['https://trcraic-png.github.io/Marc/erp/residente.html', 'ObraControl | Residente'],
            ['https://trcraic-png.github.io/Marc/erp/inversionista.html', 'ObraControl Inversionista'],
            ['https://trcraic-png.github.io/Marc/erp/cliente.html', 'Portal de cliente'],
          ];

          const browser = await chromium.launch({ headless: true });
          const errors = [];

          for (const [url, expectedTitle] of checks) {
            const page = await browser.newPage();
            const pageErrors = [];
            page.on('pageerror', e => pageErrors.push('pageerror: ' + e.message));
            page.on('console', msg => {
              if (msg.type() === 'error') pageErrors.push('console: ' + msg.text());
            });

            const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForTimeout(1200);
            const title = await page.title();
            const body = await page.locator('body').innerText().catch(() => '');

            if (!response || response.status() >= 400) {
              errors.push(`${url}: HTTP ${response?.status() ?? 'no response'}`);
            }
            if (!title.includes(expectedTitle)) {
              errors.push(`${url}: unexpected title "${title}"`);
            }
            if (!body.trim() || body.includes('Page not found')) {
              errors.push(`${url}: empty or invalid page body`);
            }

            const ignorable = pageErrors.filter(x =>
              !x.includes('favicon') &&
              !x.includes('net::ERR_BLOCKED_BY_CLIENT')
            );
            if (ignorable.length) errors.push(`${url}: ${ignorable.join(' | ')}`);
            await page.close();
          }

          await browser.close();
          if (errors.length) {
            console.error(errors.join('\n'));
            process.exit(1);
          }
          console.log('Browser runtime checks passed for all four portals.');
          NODE
          node /tmp/erp-browser-check.mjs

      - name: Open or update ERP health issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[ERP HEALTH] ObraControl requiere revisión';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(i => i.title === title);
            const body = `Falló la validación automática de las 4 apps de ObraControl ERP.

            Workflow: ${context.workflow}
            Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
            Commit: ${context.sha}

            El sistema ya intentó un redeploy automático de GitHub Pages cuando correspondía.`;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }


      - name: Close ERP health issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[ERP HEALTH] ObraControl requiere revisión';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed'
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: 'La validación automática volvió a pasar correctamente en las 4 apps.'
              });
            }
