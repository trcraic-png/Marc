<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>CIM65 · Chat de Obra</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#e5ddd5;color:#172033}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#0f172a,#075e54)}.box{width:min(460px,100%);background:#fff;border-radius:20px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}h1{font-size:21px;margin:0 0 5px}.muted{font-size:11px;color:#667085;line-height:1.5}.grid{display:grid;gap:9px;margin-top:14px}label span{display:block;font-size:9px;text-transform:uppercase;font-weight:900;color:#475467;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:10px;font:inherit}.btn{border:0;border-radius:10px;padding:10px 13px;background:#128c7e;color:#fff;font-weight:900;cursor:pointer}.btn.alt{background:#eef2f6;color:#344054}
.app{height:100vh;display:flex;flex-direction:column}.head{background:#075e54;color:#fff;padding:11px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 2px 12px rgba(0,0,0,.15)}.avatar{width:40px;height:40px;border-radius:50%;background:#128c7e;display:grid;place-items:center;font-weight:900}.head b{display:block;font-size:13px}.head small{font-size:9px;color:#d1fae5}.spacer{flex:1}.head button{border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;border-radius:9px;padding:7px 9px;font-size:10px}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:7px;background:#efeae2}.msg{max-width:min(78%,640px);background:#fff;border-radius:8px;padding:8px 10px;box-shadow:0 1px 2px rgba(0,0,0,.08);align-self:flex-start}.msg.mine{align-self:flex-end;background:#d9fdd3}.who{font-size:8px;font-weight:900;color:#075e54}.body{font-size:12px;white-space:pre-wrap;word-break:break-word;margin-top:2px}.time{text-align:right;font-size:8px;color:#667085;margin-top:3px}.empty{margin:auto;color:#667085;background:rgba(255,255,255,.75);padding:12px;border-radius:12px;font-size:11px}
.status{text-align:center;font-size:8px;color:#667085;background:#f8fafc;padding:5px}.composer{display:flex;gap:8px;padding:9px;background:#f0f2f5;align-items:flex-end}.composer textarea{resize:none;min-height:42px;max-height:100px;border-radius:22px;padding:11px 14px}.send{width:44px;height:44px;border-radius:50%;border:0;background:#128c7e;color:#fff;font-size:19px;cursor:pointer;flex:0 0 44px}
@media(max-width:600px){.msg{max-width:88%}.head{padding:9px 10px}.msgs{padding:10px}}

.attach{border:0;width:44px;height:44px;border-radius:50%;background:#fff;color:#075e54;font-size:20px;cursor:pointer;flex:0 0 44px}
.filebar{display:none;gap:6px;flex-wrap:wrap;padding:6px 9px;background:#f0f2f5;border-top:1px solid #e4e7ec}.filebar.show{display:flex}.chip{background:#fff;border:1px solid #d0d5dd;border-radius:9px;padding:5px 7px;font-size:8px;display:flex;gap:5px;align-items:center;max-width:190px}.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chip button{border:0;background:transparent;color:#b42318;font-weight:900}
.atts{display:grid;gap:6px;margin-top:6px}.attimg{max-width:240px;max-height:190px;border-radius:8px;object-fit:cover;border:1px solid #d0d5dd}.attdoc{display:flex;align-items:center;gap:7px;background:#f8fafc;border:1px solid #e4e7ec;border-radius:8px;padding:7px;text-decoration:none;color:#344054;font-size:9px;font-weight:800}.attdoc small{font-weight:500;color:#667085}
</style>
</head>
<body>
<div id="login" class="login"><div class="box"><h1>💬 Chat de Obra CIM65</h1><div class="muted">Canal privado por obra entre Administrador, Cliente y Residente. Las claves se conservan solo durante esta sesión del navegador.</div>
<div class="grid"><label><span>Tipo de acceso</span><select id="role"><option value="cliente">Cliente</option><option value="residente">Residente</option><option value="admin">Administrador</option></select></label>
<label><span>Clave de acceso</span><input id="key" type="password" autocomplete="off" placeholder="Clave privada"></label>
<div id="projectWrap" class="hidden"><label><span>Obra</span><select id="project"><option value="">Cargar obras…</option></select></label></div>
<button id="enter" class="btn">Entrar al chat</button><div id="err" class="muted"></div></div></div></div>
<div id="app" class="app hidden"><div class="head"><div class="avatar">OC</div><div><b id="title">Chat de obra</b><small id="actor"></small></div><div class="spacer"></div><button id="reload">Actualizar</button><button id="exit">Salir</button></div><div style="background:#f8fafc;text-align:center;padding:5px"><button id="older" class="btn alt hidden" style="padding:5px 9px">↑ Cargar mensajes anteriores</button></div><div id="msgs" class="msgs"><div class="empty">Cargando…</div></div><div id="status" class="status">Actualización automática cada 2.5 s</div><div id="filebar" class="filebar"></div><div class="composer"><input id="fileinput" type="file" multiple accept=".jpg,.jpeg,.png,.webp,.pdf,.xlsx,.xls,.docx,.txt" class="hidden"><button id="attach" class="attach" aria-label="Adjuntar">📎</button><textarea id="input" maxlength="4000" placeholder="Escribe una consulta…"></textarea><button id="send" class="send">➤</button></div></div>
<script>
const CHAT='https://syhfjvhfpuvbawgexdun.supabase.co/functions/v1/obra-client-portal-api',ADMIN='https://syhfjvhfpuvbawgexdun.supabase.co/functions/v1/obra-admin-api';
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let role='cliente',key='',projectId='',actor=null,last=null,oldest=null,hasMore=false,timer=null,FILES=[];
function hdr(){let h={'Content-Type':'application/json'};if(role==='cliente')h['x-client-key']=key;else if(role==='residente')h['x-resident-key']=key;else h['x-admin-key']=key;return h}
async function chat(action,extra={}){let b={action,...extra};if(role==='admin')b.project_id=projectId;let r=await fetch(CHAT,{method:'POST',headers:hdr(),body:JSON.stringify(b)});let j=await r.json().catch(()=>({}));if(!r.ok||j.ok===false)throw new Error(j.error||'No fue posible abrir el chat.');return j}
async function loadProjects(){let r=await fetch(ADMIN,{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':key},body:JSON.stringify({action:'load'})});let j=await r.json().catch(()=>({}));if(!r.ok||j.ok===false)throw new Error(j.error||'Clave administrativa incorrecta.');let a=j.projects||[];$('#project').innerHTML='<option value="">Selecciona una obra</option>'+a.map(p=>'<option value="'+E(p.id)+'">'+E((p.code?p.code+' · ':'')+(p.name||'Obra'))+'</option>').join('');$('#projectWrap').classList.remove('hidden')}
function render(a,append=false){let b=$('#msgs');if(!append)b.innerHTML='';if(!a.length&&!append){b.innerHTML='<div class="empty">Todavía no hay mensajes. Inicia la conversación.</div>';return}a.forEach(m=>{let mine=actor&&m.sender_role===actor.role&&m.sender_name===actor.name,d=document.createElement('div');d.className='msg'+(mine?' mine':'');let t=new Date(m.created_at);let aa=(m.attachments||[]).map(a=>{let u=E(a.url||a.download_url||''),n=E(a.file_name||'archivo'),mt=String(a.mime_type||'');if(mt.startsWith('image/')&&u)return '<a href="'+u+'" target="_blank" rel="noopener"><img class="attimg" src="'+u+'" alt="'+n+'"></a>';if(u)return '<a class="attdoc" href="'+E(a.download_url||a.url)+'" target="_blank" rel="noopener">📄 <span>'+n+'<br><small>'+E(mt)+'</small></span></a>';return '<div class="attdoc">📄 '+n+'</div>'}).join('');d.innerHTML='<div class="who">'+E(m.sender_name)+' · '+E(m.sender_role)+'</div><div class="body">'+E(m.body)+'</div>'+(aa?'<div class="atts">'+aa+'</div>':'')+'<div class="time">'+(isNaN(t)?'':t.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}))+'</div>';b.appendChild(d);last=m.created_at});b.scrollTop=b.scrollHeight}
function prependMsgs(a){let b=$('#msgs'),oldH=b.scrollHeight,first=b.firstChild;a.forEach(m=>{let mine=actor&&m.sender_role===actor.role&&m.sender_name===actor.name,d=document.createElement('div');d.className='msg'+(mine?' mine':'');let t=new Date(m.created_at),aa=(m.attachments||[]).map(x=>{let u=E(x.url||x.download_url||''),n=E(x.file_name||'archivo'),mt=String(x.mime_type||'');if(mt.startsWith('image/')&&u)return '<a href="'+u+'" target="_blank" rel="noopener"><img class="attimg" src="'+u+'" alt="'+n+'"></a>';if(u)return '<a class="attdoc" href="'+E(x.download_url||x.url)+'" target="_blank" rel="noopener">📄 <span>'+n+'<br><small>'+E(mt)+'</small></span></a>';return '<div class="attdoc">📄 '+n+'</div>'}).join('');d.innerHTML='<div class="who">'+E(m.sender_name)+' · '+E(m.sender_role)+'</div><div class="body">'+E(m.body)+'</div>'+(aa?'<div class="atts">'+aa+'</div>':'')+'<div class="time">'+(isNaN(t)?'':t.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}))+'</div>';b.insertBefore(d,first)});b.scrollTop=b.scrollHeight-oldH}
async function loadOlder(){if(!oldest||!hasMore)return;let x=$('#older');x.disabled=true;try{let j=await chat('chat_load',{before:oldest});prependMsgs(j.messages||[]);if((j.messages||[]).length)oldest=j.oldest_at||j.messages[0].created_at;hasMore=!!j.has_more;x.classList.toggle('hidden',!hasMore)}catch(e){$('#status').textContent=e.message}finally{x.disabled=false}}
async function load(initial=false){try{let j=await chat('chat_load',initial?{}:{since:last||undefined});actor=j.actor||actor;$('#title').textContent=(j.project?.code?j.project.code+' · ':'')+(j.project?.name||'Chat de obra');$('#actor').textContent=(actor?.name||'')+' · '+(actor?.role||'');render(j.messages||[],!initial);if(initial){oldest=j.oldest_at||((j.messages||[])[0]?.created_at)||null;hasMore=!!j.has_more;$('#older').classList.toggle('hidden',!hasMore)}$('#status').textContent='En línea · actualización automática'}catch(e){$('#status').textContent='Sin conexión · reintentando'}}
async function enter(){role=$('#role').value;key=$('#key').value.trim();$('#err').textContent='';if(!key)return $('#err').textContent='Captura la clave de acceso.';try{if(role==='admin'&&!projectId){await loadProjects();projectId=$('#project').value;if(!projectId){$('#err').textContent='Selecciona una obra y vuelve a pulsar Entrar.';return}}sessionStorage.setItem('oc_chat_role',role);sessionStorage.setItem('oc_chat_key',key);if(projectId)sessionStorage.setItem('oc_chat_project',projectId);$('#login').classList.add('hidden');$('#app').classList.remove('hidden');last=null;oldest=null;hasMore=false;$('#older').classList.add('hidden');await load(true);clearInterval(timer);timer=setInterval(()=>load(false),2500)}catch(e){$('#err').textContent=e.message}}
async function f64(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(String(r.result||'').split(',')[1]||'');r.onerror=()=>rej(Error('No se pudo leer el archivo'));r.readAsDataURL(f)})}
function showFiles(){let b=$('#filebar');b.classList.toggle('show',FILES.length>0);b.innerHTML=FILES.map((f,i)=>'<div class="chip">📎 <span>'+E(f.name)+'</span><button onclick="rmFile('+i+')">×</button></div>').join('')}
window.rmFile=i=>{FILES.splice(i,1);showFiles();$('#fileinput').value=''};
async function send(){let i=$('#input'),m=i.value.trim();if(!m&&!FILES.length)return;let total=FILES.reduce((s,f)=>s+f.size,0);if(total>10*1024*1024){$('#status').textContent='Los adjuntos de un mensaje no pueden superar 10 MB en total.';return}let b=$('#send');b.disabled=true;try{let attachments=[];for(const f of FILES)attachments.push({file_name:f.name,mime_type:f.type||'text/plain',base64:await f64(f)});let j=await chat('chat_send',{message:m,attachments});i.value='';FILES=[];showFiles();$('#fileinput').value='';if(j.message)render([j.message],true)}catch(e){$('#status').textContent=e.message}finally{b.disabled=false;i.focus()}}
$('#older').onclick=loadOlder;$('#role').onchange=()=>{$('#projectWrap').classList.add('hidden');projectId=''};$('#project').onchange=()=>projectId=$('#project').value;$('#enter').onclick=enter;$('#send').onclick=send;$('#attach').onclick=()=>$('#fileinput').click();$('#fileinput').onchange=e=>{let a=[...e.target.files].slice(0,3);if(a.some(f=>f.size>10*1024*1024)){ $('#status').textContent='Cada archivo puede pesar máximo 10 MB.';return }FILES=a;showFiles()};$('#reload').onclick=()=>{last=null;load(true)};$('#input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('#exit').onclick=()=>{clearInterval(timer);sessionStorage.removeItem('oc_chat_role');sessionStorage.removeItem('oc_chat_key');sessionStorage.removeItem('oc_chat_project');location.reload()};
(function(){let qs=new URLSearchParams(location.search),qr=(qs.get('role')||'').toLowerCase();if(['cliente','residente','admin'].includes(qr)){role=qr;$('#role').value=role;if(role==='admin')$('#projectWrap').classList.add('hidden')}let h=location.hash.replace(/^#/,'');let m=h.match(/^(cliente|residente):([0-9a-f]{64})$/i);if(m){role=m[1].toLowerCase();key=m[2];$('#role').value=role;$('#key').value=key;history.replaceState(null,'',location.pathname);enter();return}let r=sessionStorage.getItem('oc_chat_role'),k=sessionStorage.getItem('oc_chat_key'),p=sessionStorage.getItem('oc_chat_project');if(r&&k){role=r;key=k;projectId=p||'';$('#role').value=role;$('#key').value=key;if(role==='admin'&&projectId){$('#projectWrap').classList.remove('hidden');$('#project').innerHTML='<option value="'+E(projectId)+'">Obra seleccionada</option>';$('#project').value=projectId}enter()}})();
</script></body></html>
